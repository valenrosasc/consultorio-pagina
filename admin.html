<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Consultorio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4a9d7f 0%, #2d6b56 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Login Screen */
        .login-container {
            max-width: 450px;
            margin: 100px auto;
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .login-container h1 {
            color: #3d8268;
            margin-bottom: 10px;
        }

        .login-container p {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #3d8268;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4a9d7f;
            box-shadow: 0 0 0 3px rgba(74, 157, 127, 0.1);
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a9d7f, #3d8268);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 157, 127, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #666;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            padding: 10px 20px;
            font-size: 14px;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60, #229954);
            color: white;
            padding: 10px 20px;
            font-size: 14px;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            padding: 10px 20px;
            font-size: 14px;
        }

        .btn-sm {
            padding: 8px 15px;
            font-size: 13px;
        }

        /* Dashboard */
        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .header {
            background: white;
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #3d8268;
            font-size: 26px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #4a9d7f;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .stat-card .number {
            color: #3d8268;
            font-size: 36px;
            font-weight: 700;
        }

        .content-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .content-card h2 {
            color: #3d8268;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filters input,
        .filters select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        .filters input:focus,
        .filters select:focus {
            outline: none;
            border-color: #4a9d7f;
        }

        .appointments-table {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #4a9d7f, #3d8268);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr {
            transition: all 0.3s ease;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-confirmed {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 35px;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            color: #3d8268;
        }

        .close-modal {
            font-size: 30px;
            cursor: pointer;
            color: #999;
            line-height: 1;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            color: #333;
            transform: rotate(90deg);
        }

        .calendar-inline {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
            }

            .filters {
                flex-direction: column;
            }

            .filters input,
            .filters select {
                width: 100%;
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 10px 8px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginScreen">
        <h1>🔐 Panel Administrativo</h1>
        <p>Dr. Juan Carlos Rosas Valencia</p>
        <form onsubmit="login(event)">
            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" id="username" required placeholder="citasconsultorio23@gmail.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required placeholder="Ingrese la contraseña">
            </div>
            <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">Volver al Inicio</button>
        </form>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="container">
            <!-- Header -->
            <div class="header">
                <div>
                    <h1>Panel de Administración</h1>
                    <p style="color: #666; margin-top: 5px;">Gestión de citas médicas</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary btn-sm" onclick="openAddModal()">➕ Nueva Cita</button>
                    <button class="btn btn-secondary btn-sm" onclick="logout()">Cerrar Sesión</button>
                </div>
            </div>

            <!-- Statistics -->
            <div class="stats-container">
                <div class="stat-card">
                    <h3>Citas Hoy</h3>
                    <div class="number" id="statsToday">0</div>
                </div>
                <div class="stat-card">
                    <h3>Total Citas</h3>
                    <div class="number" id="statsTotal">0</div>
                </div>
                <div class="stat-card">
                    <h3>Esta Semana</h3>
                    <div class="number" id="statsWeek">0</div>
                </div>
                <div class="stat-card">
                    <h3>Este Mes</h3>
                    <div class="number" id="statsMonth">0</div>
                </div>
            </div>

            <!-- Appointments List -->
            <div class="content-card">
                <h2>
                    <span>Lista de Citas</span>
                </h2>

                <div class="filters">
                    <input type="date" id="filterDate" onchange="filterAppointments()" placeholder="Filtrar por fecha">
                    <select id="filterStatus" onchange="filterAppointments()">
                        <option value="">Todos los estados</option>
                        <option value="confirmed">Confirmadas</option>
                        <option value="pending">Pendientes</option>
                        <option value="cancelled">Canceladas</option>
                    </select>
                    <input type="text" id="filterSearch" onkeyup="filterAppointments()" placeholder="Buscar paciente...">
                    <button class="btn btn-secondary btn-sm" onclick="clearFilters()">Limpiar Filtros</button>
                </div>

                <div class="appointments-table" id="appointmentsContainer">
                    <!-- La tabla se llenará dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para agregar/editar cita -->
    <div class="modal" id="appointmentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nueva Cita</h2>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>

            <form onsubmit="saveAppointment(event)">
                <div class="form-group">
                    <label>Fecha de la cita *</label>
                    <input type="date" id="appointmentDate" required>
                </div>

                <div class="form-group">
                    <label>Horario *</label>
                    <select id="appointmentTime" required>
                        <option value="">Seleccione un horario</option>
                        <option value="15:00">3:00 PM - 3:30 PM</option>
                        <option value="15:30">3:30 PM - 4:00 PM</option>
                        <option value="16:00">4:00 PM - 4:30 PM</option>
                        <option value="16:30">4:30 PM - 5:00 PM</option>
                        <option value="17:00">5:00 PM - 5:30 PM</option>
                        <option value="17:30">5:30 PM - 6:00 PM</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nombre del paciente *</label>
                    <input type="text" id="patientName" required placeholder="Nombre completo">
                </div>

                <div class="form-group">
                    <label>Cédula *</label>
                    <input type="text" id="patientId" required placeholder="Número de cédula">
                </div>

                <div class="form-group">
                    <label>Teléfono *</label>
                    <input type="tel" id="patientPhone" required placeholder="Número de contacto">
                </div>

                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="patientEmail" placeholder="ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label>Motivo de consulta</label>
                    <textarea id="consultReason" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-family: 'Poppins', sans-serif; min-height: 80px;" placeholder="Descripción breve..."></textarea>
                </div>

                <div class="form-group">
                    <label>Estado</label>
                    <select id="appointmentStatus">
                        <option value="confirmed">Confirmada</option>
                        <option value="pending">Pendiente</option>
                        <option value="cancelled">Cancelada</option>
                    </select>
                </div>

                <input type="hidden" id="editingId">

                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()" style="flex: 1;">Cancelar</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Guardar Cita</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Credenciales de acceso (en producción, esto debería estar en un backend seguro)
        const ADMIN_USERNAME = 'citasconsultorio23@gmail.com';
        const ADMIN_PASSWORD = 'consultorio2026';

        let allAppointments = [];
        let editingAppointment = null;

        // Login
        function login(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').classList.add('active');
                sessionStorage.setItem('adminLoggedIn', 'true');
                loadAppointments();
            } else {
                alert('Usuario o contraseña incorrectos');
            }
        }

        function logout() {
            sessionStorage.removeItem('adminLoggedIn');
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('dashboard').classList.remove('active');
        }

        // Cargar citas del localStorage
        function loadAppointments() {
            const appointments = JSON.parse(localStorage.getItem('appointmentsData') || '[]');
            allAppointments = appointments;
            renderAppointments(appointments);
            updateStatistics(appointments);
        }

        // Renderizar tabla de citas
        function renderAppointments(appointments) {
            const container = document.getElementById('appointmentsContainer');
            
            if (appointments.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📅</div>
                        <h3>No hay citas registradas</h3>
                        <p>Comienza agregando una nueva cita</p>
                    </div>
                `;
                return;
            }

            // Ordenar por fecha y hora
            appointments.sort((a, b) => {
                const dateA = new Date(a.date + ' ' + a.time);
                const dateB = new Date(b.date + ' ' + b.time);
                return dateB - dateA;
            });

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Paciente</th>
                            <th>Teléfono</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            appointments.forEach(appointment => {
                const statusClass = `status-${appointment.status || 'confirmed'}`;
                const statusText = {
                    'confirmed': 'Confirmada',
                    'pending': 'Pendiente',
                    'cancelled': 'Cancelada'
                }[appointment.status || 'confirmed'];

                const date = new Date(appointment.date);
                const formattedDate = date.toLocaleDateString('es-CO', { 
                    weekday: 'short', 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });

                html += `
                    <tr>
                        <td>${formattedDate}</td>
                        <td>${formatTimeLabel(appointment.time)}</td>
                        <td>
                            <strong>${appointment.patient.name}</strong><br>
                            <small style="color: #999;">CC: ${appointment.patient.id}</small>
                        </td>
                        <td>
                            <a href="tel:${appointment.patient.phone}" style="color: #4a9d7f; text-decoration: none;">
                                ${appointment.patient.phone}
                            </a>
                        </td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-warning btn-sm" onclick='editAppointment(${JSON.stringify(appointment).replace(/'/g, "&apos;")})'>Editar</button>
                                <button class="btn btn-danger btn-sm" onclick='deleteAppointment("${appointment.id}")'>Eliminar</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        // Actualizar estadísticas
        function updateStatistics(appointments) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const todayStr = formatDate(today);
            const weekStart = new Date(today);
            weekStart.setDate(today.getDate() - today.getDay() + 1);
            const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);

            const statsToday = appointments.filter(a => 
                a.date === todayStr && a.status !== 'cancelled'
            ).length;

            const statsWeek = appointments.filter(a => {
                const appointmentDate = new Date(a.date);
                return appointmentDate >= weekStart && appointmentDate <= today && a.status !== 'cancelled';
            }).length;

            const statsMonth = appointments.filter(a => {
                const appointmentDate = new Date(a.date);
                return appointmentDate >= monthStart && a.status !== 'cancelled';
            }).length;

            const statsTotal = appointments.filter(a => a.status !== 'cancelled').length;

            document.getElementById('statsToday').textContent = statsToday;
            document.getElementById('statsWeek').textContent = statsWeek;
            document.getElementById('statsMonth').textContent = statsMonth;
            document.getElementById('statsTotal').textContent = statsTotal;
        }

        // Modal
        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Nueva Cita';
            document.getElementById('appointmentModal').classList.add('active');
            document.getElementById('editingId').value = '';
            editingAppointment = null;
            
            // Limpiar formulario
            document.getElementById('appointmentDate').value = '';
            document.getElementById('appointmentTime').value = '';
            document.getElementById('patientName').value = '';
            document.getElementById('patientId').value = '';
            document.getElementById('patientPhone').value = '';
            document.getElementById('patientEmail').value = '';
            document.getElementById('consultReason').value = '';
            document.getElementById('appointmentStatus').value = 'confirmed';
        }

        function closeModal() {
            document.getElementById('appointmentModal').classList.remove('active');
        }

        function editAppointment(appointment) {
            editingAppointment = appointment;
            document.getElementById('modalTitle').textContent = 'Editar Cita';
            document.getElementById('appointmentModal').classList.add('active');

            document.getElementById('editingId').value = appointment.id;
            document.getElementById('appointmentDate').value = appointment.date;
            document.getElementById('appointmentTime').value = appointment.time;
            document.getElementById('patientName').value = appointment.patient.name;
            document.getElementById('patientId').value = appointment.patient.id;
            document.getElementById('patientPhone').value = appointment.patient.phone;
            document.getElementById('patientEmail').value = appointment.patient.email || '';
            document.getElementById('consultReason').value = appointment.patient.reason || '';
            document.getElementById('appointmentStatus').value = appointment.status || 'confirmed';
        }

        function saveAppointment(event) {
            event.preventDefault();

            const appointment = {
                id: document.getElementById('editingId').value || Date.now().toString(),
                date: document.getElementById('appointmentDate').value,
                time: document.getElementById('appointmentTime').value,
                status: document.getElementById('appointmentStatus').value,
                patient: {
                    name: document.getElementById('patientName').value,
                    id: document.getElementById('patientId').value,
                    phone: document.getElementById('patientPhone').value,
                    email: document.getElementById('patientEmail').value,
                    reason: document.getElementById('consultReason').value
                }
            };

            let appointments = JSON.parse(localStorage.getItem('appointmentsData') || '[]');

            if (editingAppointment) {
                // Editar existente
                appointments = appointments.map(a => a.id === appointment.id ? appointment : a);
            } else {
                // Agregar nueva
                appointments.push(appointment);
            }

            localStorage.setItem('appointmentsData', JSON.stringify(appointments));
            
            closeModal();
            loadAppointments();
            
            alert(editingAppointment ? 'Cita actualizada exitosamente' : 'Cita agregada exitosamente');
        }

        function deleteAppointment(id) {
            if (!confirm('¿Está seguro de eliminar esta cita?')) {
                return;
            }

            let appointments = JSON.parse(localStorage.getItem('appointmentsData') || '[]');
            appointments = appointments.filter(a => a.id !== id);
            localStorage.setItem('appointmentsData', JSON.stringify(appointments));
            
            loadAppointments();
            alert('Cita eliminada exitosamente');
        }

        // Filtros
        function filterAppointments() {
            const dateFilter = document.getElementById('filterDate').value;
            const statusFilter = document.getElementById('filterStatus').value;
            const searchFilter = document.getElementById('filterSearch').value.toLowerCase();

            let filtered = allAppointments;

            if (dateFilter) {
                filtered = filtered.filter(a => a.date === dateFilter);
            }

            if (statusFilter) {
                filtered = filtered.filter(a => a.status === statusFilter);
            }

            if (searchFilter) {
                filtered = filtered.filter(a => 
                    a.patient.name.toLowerCase().includes(searchFilter) ||
                    a.patient.id.includes(searchFilter) ||
                    a.patient.phone.includes(searchFilter)
                );
            }

            renderAppointments(filtered);
        }

        function clearFilters() {
            document.getElementById('filterDate').value = '';
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterSearch').value = '';
            renderAppointments(allAppointments);
        }

        // Utilidades
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatTimeLabel(time) {
            const timeLabels = {
                '15:00': '3:00 PM',
                '15:30': '3:30 PM',
                '16:00': '4:00 PM',
                '16:30': '4:30 PM',
                '17:00': '5:00 PM',
                '17:30': '5:30 PM'
            };
            return timeLabels[time] || time;
        }

        // Migrar datos antiguos si existen
        function migrateOldData() {
            const oldAppointments = JSON.parse(localStorage.getItem('appointments') || '{}');
            const newAppointments = JSON.parse(localStorage.getItem('appointmentsData') || '[]');

            if (Object.keys(oldAppointments).length > 0 && newAppointments.length === 0) {
                const migrated = [];
                for (const [date, times] of Object.entries(oldAppointments)) {
                    times.forEach(time => {
                        migrated.push({
                            id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
                            date: date,
                            time: time,
                            status: 'confirmed',
                            patient: {
                                name: 'Paciente',
                                id: 'N/A',
                                phone: 'N/A',
                                email: '',
                                reason: ''
                            }
                        });
                    });
                }
                localStorage.setItem('appointmentsData', JSON.stringify(migrated));
            }
        }

        // Verificar si ya está logueado
        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            migrateOldData();
            loadAppointments();
        }
    </script>
</body>
</html>
